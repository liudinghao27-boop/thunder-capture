  # 这些词是征兵咨询博主视频标题里的高频词，匹配垂直账号
  - "参军规划"
  - "兵爸兵妈"
  - "入伍指南"
  - "役前训练"
  - "参军知识"
  - "当兵攻略"
  - "征兵政策"
  # ── 第二层：痛点场景（高意图评论来源）──
  - "征兵体检标准"
  - "政审不过"
  - "征信逾期当兵"
  - "体检淘汰"
  - "征兵被刷"
  - "近视手术当兵"
  - "纹身洗掉当兵"
  - "扁平足当兵"
  # ── 第三层：行动意图（搜索即意向）──
