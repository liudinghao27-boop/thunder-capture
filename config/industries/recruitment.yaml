  - "准备入伍"
  - "参军准备"
  - "当兵咨询"
  - "入伍条件"
  # ── 第四层：垂直子赛道 ──
  - "直招军士"
  - "定向军士"
  - "军队文职报考"
  - "女兵征兵条件"
  - "大专当兵政策"
  - "二次入伍"
reply_tone: "退伍老兵"
reply_style: "称对方为兄弟/战友，语气亲切，15-30字，不要用加微信等敏感词"
categories:
  - "入伍条件"
  - "体检咨询"
  - "学历咨询"
  - "政审相关"
  - "兵种选择"
  - "退役规划"
  - "其他"
daily_limit: 50
video_max_age_days: 14
comment_max_age_hours: 336
min_followers: 500
# 征兵赛道专用意图词和噪声词
intent_keywords:
  - "可以吗|能不能|行不行|会不会|要不要"
  - "怎么|如何|怎样|咋"
  - "问[一下下看瞧]|请问|问下|咨询|了解"
  - "条件|要求|标准|规定"
  - "报名|申请|流程|时间"
  - "多少|多久|什么时候"
  - "有.*吗|行吗|对吗|对吗"
  - "体检|政审|近视|身高|体重|纹身|扁平"
  - "推荐|建议|帮[帮我忙看]"
  - "想去|想当|想入伍|想参军"
noise_keywords:
  - "^[哈嘿嘻呵嗯哦啊哇]+$"
  - "^(加油|支持|顶|赞|666|厉害|牛|帅|棒) "
  - "^(第一|沙发|来了|打卡|前排)$"
  - "致敬|辛苦了|最帅|最棒|光荣"
  - "已报名|报名了|报上了|通过了|入伍了"
