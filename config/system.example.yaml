# 雷霆捕获系统 — 全局配置模板
# 复制为 system.yaml 并填入真实值
# ===========================================

# API 密钥（支持 ${ENV_VAR} 占位符）
api_keys:
  deepseek: "${THUNDER_DEEPSEEK_KEY}"
  zhipu: "${THUNDER_ZHIPU_KEY}"
  openai: "${THUNDER_OPENAI_KEY}"

# 智谱 AutoGLM（手机操控 + Vision 视觉）
autoglm:
  base_url: "https://open.bigmodel.cn/api/paas/v4"
  model: "autoglm-phone"
  vision_model: "glm-4v"

# 数据库
database:
  path: "data/thunder.db"

# 设备矩阵
# 注意：adb_serial 是敏感信息，请替换为你自己的真实设备序列号。
devices:
  - id: "xiaomi-main"
    adb_serial: "YOUR_ADB_SERIAL_1"
    daily_limit: 10
    min_interval_sec: 120

# 采集配置
collector:
  max_authors_per_run: 12
  videos_per_keyword: 6
  top_creator_videos: 8
  min_comment_count: 1
  username_min_length: 2
