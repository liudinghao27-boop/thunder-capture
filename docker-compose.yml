# 雷霆捕获系统 — 核心基础设施
#
# 启动:  docker compose up -d
# 停止:  docker compose down
# 状态:  docker compose ps

services:
  postgres:
    image: postgres:16-alpine
    container_name: thunder-pg
    restart: unless-stopped
    environment:
      POSTGRES_USER: thunder
      POSTGRES_PASSWORD: thunder123
      POSTGRES_DB: thunder
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U thunder"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: thunder-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pg_data:
  redis_data:

