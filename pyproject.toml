[project]
name = "thunder-capture"
version = "0.2.0"
description = "雷霆捕获系统 — AI Agent 驱动的多设备社媒私域获客矩阵"
requires-python = ">=3.10"
license = "MIT"
authors = [
    {name = "Thunder Team"}
]

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy>=2.0.0",
    "bcrypt>=4.0.0",
    "cryptography>=42.0.0",
    "python-jose[cryptography]>=3.3.0",
    "openai>=1.50.0",
    "httpx>=0.27.0",
    "pydantic>=2.10.0",
    "python-multipart>=0.0.9",
    "json-repair>=0.30.0",
    "PyYAML>=6.0",
    "python-dotenv>=1.0.0",
    "requests>=2.32.0",
    "Pillow>=10.0.0",
    "numpy>=1.26.0",
    "playwright>=1.45.0",
    "easyocr>=1.7.2",
    "openpyxl>=3.1.0",
]

[project.optional-dependencies]
adapters = [
    "psycopg2-binary>=2.9.0",
    "alembic>=1.13.0",
    "celery[redis]>=5.4.0",
    "redis>=5.0.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_return_any = true
warn_unused_configs = true
plugins = ["sqlalchemy.ext.mypy.plugin"]
exclude = [
    "deps/",
    "data/",
    "logs/",
    "scripts/",
]

# Legacy files with heavy SQLAlchemy Column[type] access patterns.
# These generate many false-positive type errors because models are not yet
# fully migrated to Mapped[T] annotations. They are tracked as technical debt.
[[tool.mypy.overrides]]
module = [
    "server.api.auth",
    "server.api.dashboard",
    "server.api.devices",
    "server.api.industries",
    "server.api.jobs",
    "server.api.leads",
    "server.api.stats",
    "server.api.agent",
    "server.workers",
    "core.config",
    "core.device.supervisor",
    "core.agent.perception",
    "core.agent.memory",
    "core.strategy.policy",
]
ignore_errors = true

[tool.setuptools.packages.find]
exclude = ["deps*", "data*", "logs*", "scripts*"]

[build-system]
requires = ["setuptools>=64.0.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
pythonpath = ["."]
addopts = "--import-mode=importlib"
markers = [
    "contract: frontend/backend API contract tests",
    "matrix: multi-device scheduling tests",
    "real_device: requires a connected Android device",
    "e2e: browser end-to-end tests",
]
