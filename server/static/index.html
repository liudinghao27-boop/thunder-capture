<!DOCTYPE html>
<html lang="zh-CN" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>雷霆捕获系统 — 获客营销控制台</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        slate: {
                            950: '#030712',
                            900: '#0f172a',
                            800: '#1e293b',
                            700: '#334155',
                        },
                        cyan: {
                            400: '#22d3ee',
                            500: '#06b6d4',
                            600: '#0891b2',
                        },
                        pink: {
                            400: '#f472b6',
                            500: '#ec4899',
                        }
                    }
                }
            }
        }
    </script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #030712;
        }
        h1, h2, h3, .font-display {
            font-family: 'Outfit', sans-serif;
        }
        .glass-panel {
            background: rgba(15, 23, 42, 0.65);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .glass-card {
            background: rgba(30, 41, 59, 0.45);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .glass-card:hover {
            border-color: rgba(34, 211, 238, 0.35);
            box-shadow: 0 0 20px rgba(34, 211, 238, 0.08);
            transform: translateY(-2px);
        }
        .neon-text-cyan {
            text-shadow: 0 0 8px rgba(34, 211, 238, 0.5);
        }
        .neon-text-pink {
            text-shadow: 0 0 8px rgba(244, 114, 182, 0.5);
        }
        /* Scrollbar styling */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(3, 7, 18, 0.5);
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 999px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(34, 211, 238, 0.3);
        }
    </style>
</head>
<body class="h-full text-slate-100 flex flex-col antialiased">

    <!-- Toast Notifications -->
    <div id="toast-container" class="fixed top-4 right-4 z-50 flex flex-col gap-2"></div>

    <!-- Active View Wrapper -->
    <div id="app-root" class="h-full flex flex-col">
        <!-- Loader / Landing state -->
        <div class="m-auto flex flex-col items-center gap-4">
            <div class="w-12 h-12 border-4 border-cyan-400 border-t-transparent rounded-full animate-spin"></div>
            <p class="text-slate-400 text-sm font-display tracking-wider">正在初始化系统控制台...</p>
        </div>
    </div>

    <!-- UI View Templates (Hidden in DOM, parsed by JS router) -->
    
    <!-- 1. LOGIN / REGISTER VIEW -->
    <template id="view-auth">
        <div class="min-h-full flex items-center justify-center bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-slate-900 via-slate-950 to-black p-4">
            <div class="w-full max-w-md p-8 rounded-2xl glass-panel shadow-2xl relative overflow-hidden">
                <!-- Background blur effects -->
                <div class="absolute -top-20 -left-20 w-48 h-48 bg-cyan-500/10 rounded-full blur-3xl pointer-events-none"></div>
                <div class="absolute -bottom-20 -right-20 w-48 h-48 bg-pink-500/10 rounded-full blur-3xl pointer-events-none"></div>

                <div class="flex flex-col items-center mb-8">
                    <div class="w-16 h-16 bg-gradient-to-tr from-cyan-500 to-pink-500 rounded-2xl flex items-center justify-center shadow-lg shadow-cyan-500/20 mb-3">
                        <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M13 10V3L4 14h7v7l9-11h-7z"/>
                        </svg>
                    </div>
                    <h1 class="text-2xl font-bold font-display tracking-tight bg-gradient-to-r from-cyan-400 to-pink-400 bg-clip-text text-transparent">雷霆捕获系统</h1>
                    <p class="text-slate-400 text-xs mt-1">SaaS 获客营销控制台</p>
                </div>

                <!-- Auth tabs -->
                <div class="flex border-b border-slate-800 mb-6">
                    <button id="tab-login" class="flex-1 pb-3 text-sm font-medium border-b-2 border-cyan-400 text-cyan-400 transition-colors">登录账户</button>
                    <button id="tab-register" class="flex-1 pb-3 text-sm font-medium border-b-2 border-transparent text-slate-400 hover:text-slate-200 transition-colors">注册新用户</button>
                </div>

                <form id="auth-form" class="space-y-4">
                    <div>
                        <label class="block text-xs font-semibold text-slate-400 mb-1">用户名</label>
                        <input type="text" id="auth-username" required autocomplete="username" class="w-full bg-slate-900/80 border border-slate-800 rounded-lg px-4 py-2.5 text-sm focus:outline-none focus:border-cyan-500 focus:ring-1 focus:ring-cyan-500 transition-all text-slate-200" placeholder="请输入用户名">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-400 mb-1">密码</label>
                        <input type="password" id="auth-password" required autocomplete="current-password" class="w-full bg-slate-900/80 border border-slate-800 rounded-lg px-4 py-2.5 text-sm focus:outline-none focus:border-cyan-500 focus:ring-1 focus:ring-cyan-500 transition-all text-slate-200" placeholder="请输入密码">
                    </div>
                    <button type="submit" id="auth-submit-btn" class="w-full bg-gradient-to-r from-cyan-500 to-cyan-600 hover:from-cyan-400 hover:to-cyan-500 text-slate-950 font-bold font-display text-sm py-3 rounded-lg shadow-lg shadow-cyan-500/20 hover:shadow-cyan-400/30 transition-all mt-6 flex items-center justify-center gap-2">
                        <span>立即登录</span>
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"/></svg>
                    </button>
                </form>
            </div>
        </div>
    </template>

    <!-- 2. MAIN APPLICATION WORKSPACE -->
    <template id="view-dashboard">
        <div class="h-full flex overflow-hidden">
            <!-- Sidebar -->
            <aside class="w-64 glass-panel border-r border-slate-800/80 flex flex-col shrink-0">
                <!-- Header -->
                <div class="p-6 flex items-center gap-3 border-b border-slate-800/60">
                    <div class="w-9 h-9 bg-gradient-to-tr from-cyan-500 to-pink-500 rounded-lg flex items-center justify-center shadow-lg shadow-cyan-500/20">
                        <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M13 10V3L4 14h7v7l9-11h-7z"/>
                        </svg>
                    </div>
                    <div>
                        <h2 class="font-bold text-sm tracking-wide font-display bg-gradient-to-r from-cyan-400 to-pink-400 bg-clip-text text-transparent">雷霆捕获控制台</h2>
                        <p class="text-[10px] text-slate-500">v0.1.0 (智能进化版)</p>
                    </div>
                </div>

                <!-- Nav Menu -->
                <nav class="flex-1 p-4 space-y-1">
                    <button data-nav="overview" class="nav-btn w-full flex items-center gap-3 px-4 py-2.5 rounded-lg text-sm font-medium transition-all bg-slate-800/60 text-cyan-400 border border-slate-700/30">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v4a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v4a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"/></svg>
                        <span>控制中心</span>
                    </button>
                    <button data-nav="industries" class="nav-btn w-full flex items-center gap-3 px-4 py-2.5 rounded-lg text-sm font-medium transition-all text-slate-400 hover:text-slate-200 hover:bg-slate-900/50">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"/></svg>
                        <span>项目配置</span>
                    </button>
                    <button data-nav="devices" class="nav-btn w-full flex items-center gap-3 px-4 py-2.5 rounded-lg text-sm font-medium transition-all text-slate-400 hover:text-slate-200 hover:bg-slate-900/50">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 18h.01M8 21h8a2 2 0 002-2V5a2 2 0 00-2-2H8a2 2 0 00-2 2v14a2 2 0 002 2z"/></svg>
                        <span>设备准备</span>
                    </button>
                    <button data-nav="tasks" class="nav-btn w-full flex items-center gap-3 px-4 py-2.5 rounded-lg text-sm font-medium transition-all text-slate-400 hover:text-slate-200 hover:bg-slate-900/50">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-3 7h3m-3 4h3m-6-4h.01M9 16h.01"/></svg>
                        <span>线索池</span>
                    </button>
                    <button data-nav="jobs" class="nav-btn w-full flex items-center gap-3 px-4 py-2.5 rounded-lg text-sm font-medium transition-all text-slate-400 hover:text-slate-200 hover:bg-slate-900/50">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                        <span>执行记录</span>
                    </button>
                    <button data-nav="settings" class="nav-btn w-full flex items-center gap-3 px-4 py-2.5 rounded-lg text-sm font-medium transition-all text-slate-400 hover:text-slate-200 hover:bg-slate-900/50">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
                        <span>系统设置</span>
                    </button>
                </nav>

                <!-- Footer / User info -->
                <div class="p-4 border-t border-slate-800/60 bg-slate-950/40 flex items-center justify-between">
                    <div class="flex items-center gap-2 overflow-hidden">
                        <div class="w-8 h-8 rounded-full bg-cyan-500/10 border border-cyan-400/20 flex items-center justify-center shrink-0">
                            <span id="user-avatar" class="text-xs font-bold text-cyan-400 uppercase font-display">U</span>
                        </div>
                        <div class="truncate">
                            <p id="user-displayname" class="text-xs font-medium text-slate-200 truncate">Username</p>
                            <p class="text-[9px] text-slate-500">已授权授权</p>
                        </div>
                    </div>
                    <button id="btn-logout" class="text-slate-500 hover:text-pink-400 transition-colors p-1.5 rounded-md hover:bg-slate-900" title="登出">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/></svg>
                    </button>
                </div>
            </aside>

            <!-- Main view pane -->
            <main class="flex-1 flex flex-col bg-slate-950 overflow-y-auto">
                <!-- Topbar -->
                <header class="h-16 border-b border-slate-800/60 flex items-center justify-between px-8 shrink-0 bg-slate-950/60 sticky top-0 z-10 backdrop-blur-md">
                    <h2 id="current-view-title" class="text-lg font-bold font-display tracking-wide text-slate-100">控制中心</h2>
                    <!-- Server Live status -->
                    <div class="flex items-center gap-2 px-3 py-1.5 rounded-full bg-emerald-500/10 border border-emerald-500/20">
                        <span class="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse"></span>
                        <span class="text-[10px] text-emerald-400 font-semibold tracking-wide uppercase">本地服务端已联通</span>
                    </div>
                </header>

                <!-- Subview Container -->
                <div id="subview-container" class="flex-1 p-8 space-y-8">
                    <!-- Dynamic view elements load here -->
                </div>
            </main>
        </div>
    </template>

    <!-- Subview Templates -->

    <!-- SUBVIEW: OVERVIEW -->
    <template id="tpl-subview-overview">
        <div class="space-y-8">
            <!-- Operational command center -->
            <div class="grid grid-cols-1 xl:grid-cols-3 gap-6">
                <div class="xl:col-span-2 p-6 rounded-2xl glass-panel flex flex-col gap-5">
                    <div class="flex flex-wrap items-start justify-between gap-4">
                        <div>
                            <p class="text-xs font-semibold text-cyan-400 tracking-wide uppercase">今日运营总控</p>
                            <h3 id="overview-command-title" class="font-bold text-xl font-display text-slate-100 mt-1">正在检查系统状态</h3>
                            <p id="overview-command-desc" class="text-xs text-slate-400 mt-2">把项目、LLM、设备、线索库存和任务状态汇总成可执行的下一步。</p>
                        </div>
                        <div id="overview-command-score" class="px-3 py-2 rounded-lg bg-slate-950/60 border border-slate-800 text-right">
                            <p class="text-[10px] text-slate-500 font-semibold">就绪度</p>
                            <p class="text-lg font-bold text-slate-200 font-display">--</p>
                        </div>
                    </div>
                    <div id="overview-readiness-list" class="grid grid-cols-1 md:grid-cols-2 gap-3">
                        <div class="text-xs text-slate-500">正在加载就绪检查...</div>
                    </div>
                </div>
                <div class="p-6 rounded-2xl glass-panel flex flex-col justify-between gap-5">
                    <div>
                        <p class="text-xs font-semibold text-pink-400 tracking-wide uppercase">下一步动作</p>
                        <select id="overview-industry-select" onchange="onOverviewIndustryChange()" class="w-full mt-2 bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-xs text-slate-200 focus:outline-none focus:border-cyan-500">
                            <option value="">选择项目...</option>
                        </select>
                        <h3 id="overview-next-title" class="font-bold text-lg font-display text-slate-100 mt-2">等待状态加载</h3>
                        <p id="overview-next-desc" class="text-xs text-slate-400 mt-2 leading-relaxed">系统会根据当前卡点给出最短路径。</p>
                    </div>
                    <div class="flex gap-2">
                        <button id="overview-btn-collect" onclick="triggerOverviewCollect()" disabled class="flex-1 py-3 bg-cyan-600/30 hover:bg-cyan-600/50 text-cyan-300 font-bold font-display text-xs rounded-lg transition-all disabled:opacity-30 disabled:cursor-not-allowed">
                            采集
                        </button>
                        <button id="overview-btn-send" onclick="triggerOverviewSend()" disabled class="flex-1 py-3 bg-pink-600/30 hover:bg-pink-600/50 text-pink-300 font-bold font-display text-xs rounded-lg transition-all disabled:opacity-30 disabled:cursor-not-allowed">
                            发送
                        </button>
                    </div>
                </div>
            </div>

            <!-- Summary Stats Card Grid -->
            <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
                <div class="p-6 rounded-xl glass-card relative overflow-hidden">
                    <div class="absolute -right-6 -bottom-6 w-20 h-20 bg-cyan-500/5 rounded-full blur-xl pointer-events-none"></div>
                    <p class="text-xs font-semibold text-slate-400 tracking-wide uppercase">当前获客项目</p>
                    <h3 id="stat-industries" class="text-3xl font-bold font-display mt-2 text-cyan-400 neon-text-cyan">0</h3>
                    <p class="text-[10px] text-slate-500 mt-1">个已配置项目</p>
                </div>
                <div class="p-6 rounded-xl glass-card relative overflow-hidden">
                    <div class="absolute -right-6 -bottom-6 w-20 h-20 bg-pink-500/5 rounded-full blur-xl pointer-events-none"></div>
                    <p class="text-xs font-semibold text-slate-400 tracking-wide uppercase">配置设备矩阵</p>
                    <h3 id="stat-devices" class="text-3xl font-bold font-display mt-2 text-pink-400 neon-text-pink">0</h3>
                    <p class="text-[10px] text-slate-500 mt-1">台 ADB 连接终端</p>
                </div>
                <div class="p-6 rounded-xl glass-card relative overflow-hidden">
                    <p class="text-xs font-semibold text-slate-400 tracking-wide uppercase">待发送线索</p>
                    <h3 id="stat-pending" class="text-3xl font-bold font-display mt-2 text-amber-400">0</h3>
                </div>
                <div class="p-6 rounded-xl glass-card relative overflow-hidden">
                    <p class="text-xs font-semibold text-slate-400 tracking-wide uppercase">已发送</p>
                    <h3 id="stat-done" class="text-3xl font-bold font-display mt-2 text-emerald-400">0</h3>
                </div>
                <div class="p-6 rounded-xl glass-card relative overflow-hidden">
                    <p class="text-xs font-semibold text-slate-400 tracking-wide uppercase">失败</p>
                    <h3 id="stat-failed" class="text-3xl font-bold font-display mt-2 text-pink-400">0</h3>
                </div>
                <div class="p-6 rounded-xl glass-card relative overflow-hidden">
                    <p class="text-xs font-semibold text-slate-400 tracking-wide uppercase">可用设备</p>
                    <h3 id="stat-devices-online" class="text-3xl font-bold font-display mt-2 text-cyan-400">0</h3>
                </div>
            </div>

            <!-- Main Grid layout -->
            <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                <!-- Active Industry Panel -->
                <div class="lg:col-span-2 p-6 rounded-2xl glass-panel flex flex-col gap-6">
                    <div class="flex items-center justify-between">
                        <h3 class="font-bold text-base font-display"><span id="overview-industry-title">已启用的获客项目</span></h3>
                        <button onclick="router.navigate('industries')" class="text-xs text-cyan-400 hover:text-cyan-300 font-semibold transition-colors flex items-center gap-1">
                            <span>管理全部</span>
                            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/></svg>
                        </button>
                    </div>
                    <div id="overview-industries-list" class="space-y-3"></div>

                    <!-- Warnings -->
                    <div id="overview-warnings" class="space-y-2"></div>
                </div>

                <!-- Quick Devices Panel -->
                <div class="p-6 rounded-2xl glass-panel flex flex-col gap-6">
                    <div class="flex items-center justify-between">
                        <h3 class="font-bold text-base font-display">连接设备监控</h3>
                        <button onclick="router.navigate('devices')" class="text-xs text-cyan-400 hover:text-cyan-300 font-semibold transition-colors flex items-center gap-1">
                            <span>详细管理</span>
                            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/></svg>
                        </button>
                    </div>

                    <div id="overview-devices-list" class="space-y-3 flex-1">
                        <!-- Loaded dynamically -->
                        <p class="text-slate-500 text-xs py-4 text-center">暂无连接设备</p>
                    </div>
                </div>
            </div>
        </div>
    </template>

    <!-- SUBVIEW: INDUSTRIES -->
    <template id="tpl-subview-industries">
        <div class="space-y-6">
            <div class="flex items-center justify-between">
                <p class="text-sm text-slate-400">定制针对不同业务模式的营销词、情感分类和采集策略，系统将根据设置进行大模型判定。</p>
                <button onclick="showCreateIndustryModal()" class="bg-gradient-to-r from-cyan-500 to-cyan-600 hover:from-cyan-400 hover:to-cyan-500 text-slate-950 font-bold font-display text-xs px-4 py-2.5 rounded-lg shadow-lg shadow-cyan-500/10 hover:shadow-cyan-400/20 transition-all flex items-center gap-1.5 shrink-0">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 4v16m8-8H4"/></svg>
                    <span>新建获客项目</span>

    <!-- APP LOGIC (Vanilla JS SPA Engine) -->
    <script>
        // API Base configuration
        const API_BASE = window.location.origin;
        let token = localStorage.getItem('thunder_token') || '';
        let currentUser = null;
        let activeJobPolls = {}; // job_id -> timer

        function escapeHtml(value) {
            return String(value ?? '').replace(/[&<>"']/g, (ch) => ({
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#39;'
            }[ch]));
        }

        function formatDateTime(value) {
            if (!value) return '—';
            const d = new Date(value);
            if (Number.isNaN(d.getTime())) return '—';
            return d.toLocaleString('zh-CN', { hour12: false });
        }

        function parseJsonSafe(value, fallback = null) {
            if (!value) return fallback;
            if (typeof value === 'object') return value;
            try {
                return JSON.parse(value);
            } catch (_) {
                return fallback;
            }
        }

        // Toast Helper
        function showToast(message, type = 'info') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            
            const colorMap = {
                success: 'bg-emerald-950/80 border-emerald-500/30 text-emerald-400',
                error: 'bg-pink-950/80 border-pink-500/30 text-pink-400',
                info: 'bg-cyan-950/80 border-cyan-500/30 text-cyan-400',
                warning: 'bg-amber-950/80 border-amber-500/30 text-amber-400'
            };
            
            toast.className = `px-4 py-3 rounded-lg border backdrop-blur-md shadow-lg transition-all duration-300 transform translate-y-2 opacity-0 text-xs font-medium flex items-center gap-2 ${colorMap[type] || colorMap.info}`;
            
            const iconSvg = {
                success: '<svg class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>',
                error: '<svg class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2m7-2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>',
                info: '<svg class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>',
                warning: '<svg class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/></svg>'
            };

            toast.innerHTML = `${iconSvg[type] || iconSvg.info}<span>${escapeHtml(message)}</span>`;
            container.appendChild(toast);
            
            // Trigger animation
            setTimeout(() => {
                toast.classList.remove('translate-y-2', 'opacity-0');
            }, 50);

            // Hide and remove after 4 seconds
            setTimeout(() => {
                toast.classList.add('opacity-0', 'translate-y-[-10px]');
                setTimeout(() => {
                    toast.remove();
                }, 300);
            }, 4000);
        }

        // Authenticated fetch wrapper
        async function apiFetch(endpoint, options = {}) {
            options.headers = options.headers || {};
            if (token) {
                options.headers['Authorization'] = `Bearer ${token}`;
            }
            if (options.body && !(options.body instanceof FormData)) {
                options.headers['Content-Type'] = 'application/json';
            }

            const response = await fetch(`${API_BASE}${endpoint}`, options);
            if (response.status === 401) {
                // Token expired/invalid
                localStorage.removeItem('thunder_token');
                token = '';
                currentUser = null;
                router.navigate('auth');
                showToast('授权登录失效，请重新登录', 'error');
                throw new Error('Unauthorized');
            }
            
            if (!response.ok) {
                const errData = await response.json().catch(() => ({}));
                const errMsg = errData.detail || `请求失败 (${response.status})`;
                showToast(errMsg, 'error');
                throw new Error(errMsg);
            }
            
            return response.json();
        }

        function platformLabel(platform) {
            const labels = {
                douyin: '抖音',
                kuaishou: '快手',
                wechat_channels: '视频号',
                xiaohongshu: '小红书',
                tiktok: 'TikTok',
                instagram: 'Instagram',
                facebook: 'Facebook',
                twitter: 'Twitter (X)',
                youtube: 'YouTube',
                reddit: 'Reddit',
            };
            return labels[platform] || String(platform || '').toUpperCase();
        }

        // Router
        const router = {
            currentView: '',
            currentSubview: '',
            
            navigate: async function(view) {
                stopDashboardPoll();
                const root = document.getElementById('app-root');

                // If not authenticated, force auth view
                if (!token && view !== 'auth') {
                    view = 'auth';
                }

                if (view === 'auth') {
                    root.innerHTML = document.getElementById('view-auth').innerHTML;
                    setupAuthHandlers();
                    this.currentView = 'auth';
                    return;
                }

                // If authenticated and user data not loaded yet
                if (!currentUser) {
                    try {
                        currentUser = await apiFetch('/api/auth/me');
                    } catch (e) {
                        return; // Handled by apiFetch redirection
                    }
                }

                // Render main dashboard shell if not already there
                if (this.currentView !== 'dashboard_shell') {
                    root.innerHTML = document.getElementById('view-dashboard').innerHTML;
                    
                    // User info bindings
                    document.getElementById('user-avatar').innerText = currentUser.username[0];
                    document.getElementById('user-displayname').innerText = currentUser.username;
                    
                    // Bind logout
                    document.getElementById('btn-logout').onclick = () => {
                        localStorage.removeItem('thunder_token');
                        token = '';
                        currentUser = null;
                        router.navigate('auth');
                        showToast('成功安全登出账户', 'success');
                    };

                    // Sidebar navigation binding
                    document.querySelectorAll('[data-nav]').forEach(btn => {
                        btn.onclick = () => {
                            const target = btn.getAttribute('data-nav');
                            // Active class styling
                            document.querySelectorAll('[data-nav]').forEach(b => {
                                b.className = "nav-btn w-full flex items-center gap-3 px-4 py-2.5 rounded-lg text-sm font-medium transition-all text-slate-400 hover:text-slate-200 hover:bg-slate-900/50";
                            });
                            btn.className = "nav-btn w-full flex items-center gap-3 px-4 py-2.5 rounded-lg text-sm font-medium transition-all bg-slate-800/60 text-cyan-400 border border-slate-700/30";
                            router.loadSubview(target);
                        };
                    });

                    this.currentView = 'dashboard_shell';
                }

                this.loadSubview(view);
            },

            loadSubview: async function(subview) {
                this.currentSubview = subview;
                const container = document.getElementById('subview-container');
                const title = document.getElementById('current-view-title');
                
                // Show subview title
                const titles = {
                    overview: '控制中心',
                    industries: '获客项目配置',
                    devices: '设备准备与检测',
                    tasks: '线索池管理',
                    jobs: '执行记录',
                    settings: '系统设置 (API Key 配置)'
                };
                title.innerText = titles[subview] || '雷霆控制台';

                // Render template
                const tpl = document.getElementById(`tpl-subview-${subview}`);
                if (!tpl) return;
                
                container.innerHTML = tpl.innerHTML;

                // Load view specific data
                if (subview === 'overview') {
                    await loadOverviewData();
                } else if (subview === 'industries') {
                    await loadIndustriesView();
                } else if (subview === 'devices') {
                    await loadDevicesView();
                } else if (subview === 'tasks') {
                    await populateTaskIndustryDropdown();
                    await loadTasksView();
                } else if (subview === 'jobs') {
                    await loadJobsView();
                } else if (subview === 'settings') {
                    await loadSettingsView();
                }
            }
        };

        // --- SUBVIEW HANDLERS ---

        function renderReadinessItem(label, detail, ok, actionText, actionHandler) {
            const action = !ok && actionText
                ? `<button type="button" onclick="${actionHandler}" class="text-[10px] font-bold text-cyan-300 hover:text-cyan-200">${actionText}</button>`
                : `<span class="text-[10px] font-bold text-emerald-400">OK</span>`;
            return `
                <div class="p-3 rounded-xl border ${ok ? 'bg-emerald-500/5 border-emerald-500/20' : 'bg-amber-500/5 border-amber-500/20'}">
                    <div class="flex items-center justify-between gap-3">
                        <span class="text-xs font-bold ${ok ? 'text-emerald-300' : 'text-amber-300'}">${escapeHtml(label)}</span>
                        ${action}
                    </div>
                    <p class="text-[10px] text-slate-500 mt-1 leading-relaxed">${escapeHtml(detail)}</p>
                </div>
            `;
        }

        function renderOverviewCommandCenter(overview, devices, health, aggregate, activeJobs) {
            const list = document.getElementById('overview-readiness-list');
            const title = document.getElementById('overview-command-title');
            const desc = document.getElementById('overview-command-desc');
            const score = document.getElementById('overview-command-score');
            const nextTitle = document.getElementById('overview-next-title');
            const nextDesc = document.getElementById('overview-next-desc');
            const nextAction = document.getElementById('overview-next-action');
            if (!list || !nextAction) return;

            const checks = health?.checks || [];
            const healthCheck = name => checks.find(c => c.name === name);
            const hasProject = Number(overview.industry_count || 0) > 0;
            const hasDevice = devices.length > 0;
            const hasLLM = Boolean(healthCheck('llm_keys')?.ok);
            const coreOk = Boolean(health) && ['server_db', 'jobs_table', 'engine_db'].every(name => healthCheck(name)?.ok === true);
            const hasPending = aggregate.totalPending > 0;
            const isWorking = activeJobs.length > 0;
            const primaryIndustry = aggregate.primaryIndustryId || overview.industries?.[0]?.id || '';
            const collectIndustry = aggregate.collectIndustryId || primaryIndustry;
            const readyCount = [hasProject, hasLLM, hasDevice, hasPending, coreOk].filter(Boolean).length;
            const readyPercent = Math.round((readyCount / 5) * 100);

            score.innerHTML = `
                <p class="text-[10px] text-slate-500 font-semibold">就绪度</p>
                <p class="text-lg font-bold ${readyPercent >= 80 ? 'text-emerald-400' : readyPercent >= 60 ? 'text-cyan-400' : 'text-amber-400'} font-display">${readyPercent}%</p>
            `;
            title.innerText = isWorking ? '任务执行中，关注进度和取消状态' : readyPercent >= 80 ? '系统已具备今日获客条件' : '还有关键项需要补齐';

            if (dashboardPollTimer) return;
            dashboardPollTimer = setInterval(async () => {
                if (router.currentSubview !== 'overview') { stopDashboardPoll(); return; }
                try {
                    const ds = await apiFetch('/api/dashboard/state');

                    updateOverviewButtons();

                    if (ds.active_jobs.length === 0 && overviewSelectedIndustry) {

        // Heartbeat verification inside overview / device page
        async function quickHeartbeat(btn, deviceId) {
            const indicator = btn.nextElementSibling;
            indicator.className = "w-2 h-2 rounded-full bg-amber-500 animate-pulse";
            btn.disabled = true;
            try {
                const res = await apiFetch(`/api/devices/${deviceId}/heartbeat`, { method: 'POST' });
                if (res.online) {
                    indicator.className = "w-2 h-2 rounded-full bg-emerald-500";
                    const health = res.health || {};
                    const details = [health.model, health.battery_level != null ? `电量${health.battery_level}%` : '', health.adb_keyboard_active ? '键盘OK' : '键盘未启用'].filter(Boolean).join(' · ');
                    showToast(`设备 ${res.serial} 在线${details ? '：' + details : ''}`, 'success');
                } else {
                    indicator.className = "w-2 h-2 rounded-full bg-pink-500";
                    showToast(`设备 ${res.serial} 离线：${res.health?.error || 'ADB 不可用'}`, 'warning');
                }
            } catch (e) {
                indicator.className = "w-2 h-2 rounded-full bg-pink-500";
            } finally {
                btn.disabled = false;
            }
        }

        // Job trigger collect
        async function triggerCollect(indId, forceDiscover = false) {
            try {
                localStorage.setItem('thunder_last_task_industry', indId);
                // Check blogger count to decide skip_discover
                let skipDiscover = true;
                if (!forceDiscover) {
                    try {
                        const stats = await apiFetch('/api/leads/stats?industry_slug=' + indId);
                        // If no bloggers exist yet, force full discovery
                        if ((stats.pending + stats.done + stats.failed) === 0) {
                            skipDiscover = false;
                            showToast('首次采集 — 正在全面发现对标博主...', 'info');
                        }
                    } catch(e) { skipDiscover = true; }
                } else {
                    skipDiscover = false;
                }
                const res = await apiFetch('/api/jobs/collect/start', {
                    method: 'POST',
                    body: JSON.stringify({ industry_slug: indId, skip_discover: skipDiscover })
                });
                showToast(`采集已提交，Job: ${res.job_id.slice(0, 8)}`, 'info');
                pollJobProgress(res.job_id, indId, 'collect');
                startDashboardPoll();
            } catch (e) {
                showToast(e.message || '采集启动失败', 'error');
            }
        }

        async function triggerReplenish(indId) {
            try {
                const res = await apiFetch(`/api/industries/${indId}/replenish`, {
                    method: 'POST', body: JSON.stringify({ force: true })
                });
                if (!res.started) { showToast(res.reason || '库存充足', 'success'); return; }
                showToast(`补采已提交: ${res.mode}`, 'info');
                pollJobProgress(res.job_id, indId, 'collect');
            } catch (e) {
                showToast(e.message || '补采失败', 'error');
            }
        }

        // Job status polling
        function pollJobProgress(jobId, industryId, type) {
            if (activeJobPolls[jobId]) return;
            
            showToast(`正在监测 ${type === 'collect' ? '线索采集' : '自动发信'} 进度...`, 'info');
            activeJobPolls[jobId] = {
                jobId,
                type,
                industryId,
                timer: setInterval(async () => {
                    try {
                        const status = await apiFetch(`/api/tasks/status/${jobId}`);
                        if (status.status === 'done') {
                            const sendSummary = status.send_summary || {};
                            const collectSummary = status.collect_summary || {};
                            const doneMessage = type === 'send' && Object.keys(sendSummary).length
                                ? `自动发信完成：发送 ${sendSummary.sent || 0} 封，在线设备 ${sendSummary.online_count || 0}/${sendSummary.target_count || 0}`
                                : type === 'collect' && Object.keys(collectSummary).length
                                    ? `线索采集完成：候选 ${collectSummary.candidate_comments || 0}，入队 ${collectSummary.enqueued || 0}`
                                    : `${type === 'collect' ? '线索采集' : '自动发信'} 任务执行成功！100% 完成`;
                            showToast(doneMessage, 'success');
                            clearInterval(activeJobPolls[jobId].timer);
                            delete activeJobPolls[jobId];
                            // Refresh current view
                            if (router.currentView === 'dashboard_shell') {
                                if (type === 'collect') {
                                    localStorage.setItem('thunder_last_task_industry', industryId);
                                }
                                router.loadSubview(router.currentSubview || 'overview');
                            }
                        } else if (status.status === 'failed') {
                            showToast(`任务执行失败: ${status.error || '原因未知'}`, 'error');
                            clearInterval(activeJobPolls[jobId].timer);
                            delete activeJobPolls[jobId];
                            if (router.currentView === 'dashboard_shell') {
                                router.loadSubview(router.currentSubview || 'overview');
                            }
                        } else if (status.status === 'cancelled') {
                            showToast(`${type === 'collect' ? '线索采集' : '自动发信'}任务已取消`, 'warning');
                            clearInterval(activeJobPolls[jobId].timer);
                            delete activeJobPolls[jobId];
                            if (router.currentView === 'dashboard_shell') {
                                router.loadSubview(router.currentSubview || 'overview');
                            }
                        } else {
                            // running, show progress info in logs
                            console.log(`Job ${jobId} progress: ${status.progress || 0}%`);
                        }
                    } catch (e) {
                        clearInterval(activeJobPolls[jobId].timer);
                        delete activeJobPolls[jobId];
                    }
                }, 3000)
            };
        }

        async function cancelRunningJob(jobId) {
            if (!jobId || !confirm('确定停止这个任务？当前手机动作会在安全停顿点后停止。')) return;
            try {
                await apiFetch(`/api/tasks/status/${jobId}/cancel`, { method: 'POST' });
                if (activeJobPolls[jobId]) {
                    activeJobPolls[jobId].status = 'cancelling';
                }
                showToast('已提交停止请求', 'warning');
                if (router.currentView === 'dashboard_shell') {
                    router.loadSubview(router.currentSubview || 'overview');
                }
            } catch (e) {}
        }

        // AI Config Generation
        async function generateAIConfig() {
            const desc = document.getElementById('industry-ai-desc').value.trim();
            if (!desc) {
                showToast('请先输入您的业务描述！', 'warning');
                return;
            }

            const bigDataEnabled = document.getElementById('ai-bigdata-enable').checked;
            let seedKeyword = '';
            let url = '/api/industries/generate-config';
            let requestBody = { description: desc };

            if (bigDataEnabled) {
                seedKeyword = document.getElementById('ai-bigdata-seed').value.trim();
                if (!seedKeyword) {
                    showToast('启用大数据提炼时，请先输入“种子搜索词”！', 'warning');
                    return;
                }
                url = '/api/industries/generate-config-bigdata';
                requestBody.seed_keyword = seedKeyword;
                showToast('正在初始化浏览器拉取抖音热门大数据，此步约耗时 15-20 秒，请稍候...', 'info', 10000);
            }

            const btnText = document.getElementById('btn-ai-text');
            const btnSpinner = document.getElementById('btn-ai-spinner');
            const btn = document.getElementById('btn-ai-generate');

            // Loading state
            btn.disabled = true;
            btnText.classList.add('hidden');
            btnSpinner.classList.remove('hidden');

            try {
                const res = await apiFetch(url, {
                    method: 'POST',
                    body: JSON.stringify(requestBody)
                });

                if (res) {
                    document.getElementById('industry-name').value = res.name || '';
                    
                    const slugInput = document.getElementById('industry-slug');
                    if (!slugInput.disabled) {
                        slugInput.value = res.slug || '';
                    }

                    if (res.keywords && Array.isArray(res.keywords)) {
                        document.getElementById('industry-keywords').value = res.keywords.join(',');
                    }

                    document.getElementById('industry-reply-tone').value = res.reply_tone || '';
                    document.getElementById('industry-reply-style').value = res.reply_style || '';
                    
                    if (res.llm_provider) {
                        document.getElementById('industry-llm-provider').value = res.llm_provider;
                        document.getElementById('industry-llm-model').value = res.llm_model || 'deepseek-chat';
                    }
                    
                    document.getElementById('industry-categories').value = JSON.stringify(res.categories || []);

                    if (res.bigdata_used) {
                        showToast('🎉 成功抓取抖音热门大数据，AI 已提炼出精准痛点词库并填充表单！', 'success');
                    } else {
                        showToast('AI 智能匹配配置成功，已自动填充下方表单！', 'success');
                    }
                }
            } catch (err) {
                console.error(err);
                showToast(err.message || 'AI 生成配置失败，请检查大模型 API 密钥或浏览器登录状态', 'error');
            } finally {
                // Restore state
                btn.disabled = false;
                btnText.classList.remove('hidden');
                btnSpinner.classList.add('hidden');
            }
        }

        // Remote Screen Control Functions
        let activeRemoteDeviceId = null;
        let remoteSwipeStartX = 0;
        let remoteSwipeStartY = 0;
        let remoteSwipeStartTime = 0;

        function openRemoteScreen(id, name) {
            activeRemoteDeviceId = id;
            document.getElementById('remote-screen-title').innerText = `云真机控制 - ${name}`;
            
            const loader = document.getElementById('remote-screen-loader');
            const img = document.getElementById('remote-screen-img');
            
            loader.style.display = 'flex';
            img.style.display = 'none';
            img.src = `/api/devices/${id}/screen/stream?_=${Date.now()}`;
            
            img.onload = function() {
                loader.style.display = 'none';
                img.style.display = 'block';
            };
            
            img.onerror = function() {
                loader.innerText = '屏幕连接失败，请确认设备在线。';
            };

            if (!img.dataset.listenersBound) {
                img.dataset.listenersBound = "true";
                
                img.addEventListener('mousedown', function(e) {
                    const rect = img.getBoundingClientRect();
                    remoteSwipeStartX = (e.clientX - rect.left) / rect.width;
                    remoteSwipeStartY = (e.clientY - rect.top) / rect.height;
                    remoteSwipeStartTime = Date.now();
                    e.preventDefault();
                });

                img.addEventListener('mouseup', function(e) {
                    if (!activeRemoteDeviceId) return;
                    const rect = img.getBoundingClientRect();
                    const endX = (e.clientX - rect.left) / rect.width;
                    const endY = (e.clientY - rect.top) / rect.height;
                    const duration = Date.now() - remoteSwipeStartTime;

                    const dx = endX - remoteSwipeStartX;
                    const dy = endY - remoteSwipeStartY;
                    const dist = Math.hypot(dx, dy);

                    if (dist > 0.05) {
                        // Swipe
                        apiFetch(`/api/devices/${activeRemoteDeviceId}/control/swipe`, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                x1_pct: remoteSwipeStartX,
                                y1_pct: remoteSwipeStartY,
                                x2_pct: endX,
                                y2_pct: endY,
                                duration_ms: Math.max(duration, 150)
                            })
                        }).catch(() => {});
                    } else {
                        // Tap
                        apiFetch(`/api/devices/${activeRemoteDeviceId}/control/click`, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                x_pct: remoteSwipeStartX,
                                y_pct: remoteSwipeStartY
                            })
                        }).catch(() => {});
                    }
                });
            }

            document.getElementById('modal-remote-screen').style.display = 'flex';
        }

        function closeRemoteScreen() {
            activeRemoteDeviceId = null;
            const img = document.getElementById('remote-screen-img');
            img.src = '';
            document.getElementById('modal-remote-screen').style.display = 'none';
        }

        async function scanDevices() {

                btn.classList.add('opacity-75', 'cursor-not-allowed');
                btn.querySelector('span').innerText = '正在扫描...';

            try {

                if (keyboardFailed) {

                }
                // Refresh list
                await loadDevicesView();
            } catch (e) {
                // error is already shown by apiFetch toast
            } finally {
                if (btn) {
                    btn.disabled = false;
                    btn.classList.remove('opacity-75', 'cursor-not-allowed');
                    btn.querySelector('span').innerText = '一键扫描设备';
                }

        async function loadTasksView() {
            const industryId = document.getElementById('task-filter-industry').value;
            const status = document.getElementById('task-filter-status').value;
            const tbody = document.getElementById('tasks-table-body');
            const retryAllBtn = document.getElementById('task-retry-all-btn');
            const timeHeader = document.getElementById('task-time-header');
            if (retryAllBtn) retryAllBtn.classList.toggle('hidden', status !== 'failed');
            if (timeHeader) timeHeader.innerText = status === 'done' ? '发送成功时间' : '采集时间';
            tbody.innerHTML = '';

            if (!industryId) {
                tbody.innerHTML = `<tr><td colspan="7" class="px-6 py-8 text-center text-slate-500">请先在项目配置中创建您的第一个获客项目。</td></tr>`;
                return;
            }

            // Use new /api/leads endpoint
            try {
                let url = `/api/leads?industry_slug=${industryId}&limit=50`;
                if (status) url += `&status=${status}`;
                const resp = await apiFetch(url);
                const list = resp.leads || [];
                if (list.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="7" class="px-6 py-8 text-center text-slate-500">该项目当前条件下未录入任何意向线索。</td></tr>`;
                    return;
                }
                // Update retry button to use new endpoint
                if (retryAllBtn) retryAllBtn.onclick = () => retryAllFailed(industryId);

                for (const t of list) {
                    const tr = document.createElement('tr');
                    tr.className = "hover:bg-slate-900/30 transition-colors";
                    
                    const statusColors = {
                        pending: 'bg-cyan-500/10 text-cyan-400 border-cyan-500/20',
                        retry: 'bg-amber-500/10 text-amber-400 border-amber-500/20',
                        done: 'bg-emerald-500/10 text-emerald-400 border-emerald-500/20',
                        failed: 'bg-pink-500/10 text-pink-400 border-pink-500/20',
                        claimed: 'bg-violet-500/10 text-violet-400 border-violet-500/20'
                    };

                    const statusLabels = {
                        claimed: '处理中',
                        pending: '待处理',
                        retry: '冷却重试',
                        done: '已引流',
                        failed: '失败'
                    };

                    const statusText = statusLabels[t.status] || t.status || '未知';
                    const statusBadge = `<span class="px-2.5 py-1 rounded-full border text-[9px] font-semibold ${statusColors[t.status] || 'bg-slate-800 text-slate-400'}">${escapeHtml(statusText)}</span>`;
                    const dateValue = t.status === 'done'
                        ? (t.processed_at || t.fetched_at || t.created_at || t.claimed_at)
                        : (t.fetched_at || t.created_at || t.claimed_at || t.processed_at);
                    const dateStr = formatDateTime(dateValue);
                    const retryAfter = formatDateTime(t.retry_after);
                    const userId = t.user_id || t.sec_uid || t.unique_id || t.short_id || '';
                    const userIdPreview = userId ? `${String(userId).slice(0, 15)}${String(userId).length > 15 ? '...' : ''}` : '—';
                    const userName = t.user_name || '用户';
                    const text = t.text || '';
                    const intentMeta = parseJsonSafe(t.matched_categories, {});
                    const confidence = intentMeta.confidence ? `置信度: ${intentMeta.confidence}` : '';
                    const question = intentMeta.question ? `问题: ${intentMeta.question}` : '';
                    const evidence = intentMeta.evidence ? `依据: ${intentMeta.evidence}` : '';
                    const metaLine = [confidence, question, evidence].filter(Boolean).join(' | ');
                    const metaHtml = metaLine
                        ? `<div class="mt-1 text-[10px] text-cyan-400 truncate" title="${escapeHtml(metaLine)}">${escapeHtml(metaLine)}</div>`
                        : '';
                    const retryButton = t.status === 'failed'
                        ? `<button onclick="retryTask('${escapeHtml(industryId)}', ${Number(t.id)})" class="px-2.5 py-1 rounded border border-cyan-500/30 text-cyan-300 hover:bg-cyan-500/10 text-[10px] font-semibold">重新发送</button>`
                        : `<span class="text-[10px] text-slate-600">-</span>`;

                    tr.innerHTML = `
                        <td class="px-6 py-4">
                            <div class="flex flex-col">
                                <span class="font-bold text-slate-200">${escapeHtml(userName)}</span>
                                <span class="text-[9px] text-slate-500 truncate max-w-[120px] font-mono" title="${escapeHtml(userId)}">${escapeHtml(userIdPreview)}</span>
                            </div>
                        </td>
                        <td class="px-6 py-4 max-w-[360px] font-medium text-slate-300" title="${escapeHtml(text)}">
                            <div class="truncate">${escapeHtml(text)}</div>
                            ${metaHtml}
                        </td>
                        <td class="px-6 py-4 text-center">${statusBadge}</td>
                        <td class="px-6 py-4 text-center font-bold text-slate-300">${Number(t.retry_count || 0)} 次</td>
                        <td class="px-6 py-4 text-center text-slate-400 font-mono text-[10px]">${retryAfter}</td>
                        <td class="px-6 py-4 text-center text-slate-500 font-mono text-[10px]">${dateStr}</td>
                        <td class="px-6 py-4 text-right">${retryButton}</td>
                    `;
                    tbody.appendChild(tr);
                }
            } catch (e) {}
        }

        async function retryTask(industryId, taskId) {
            if (!industryId || !taskId) return;
            if (!confirm('确定将该失败线索重新加入待发送队列吗？')) return;
            try {
                await apiFetch(`/api/industries/${industryId}/tasks/${taskId}/retry`, { method: 'POST' });
                showToast('已重新加入待发送队列', 'success');
                await loadTasksView();
                await refreshSidebarSummary();
            } catch (e) {}
        }

            try {
                const res = await apiFetch('/api/leads/retry-failed' + (industrySlug ? `?industry_slug=${industrySlug}` : ''), { method: 'POST' });

                        document.getElementById('settings-zhipu-key').value = updated.zhipu_key || '';
                        document.getElementById('settings-openai-key').value = updated.openai_key || '';
                        showToast('系统设置保存成功！', 'success');
                    } catch (err) {}
                };
            } catch (e) {}
        }

        async function loadSystemHealth() {
            const container = document.getElementById('system-health-list');
            if (!container) return;
            container.innerHTML = '<div class="text-slate-500">正在加载自检结果...</div>';
            try {
                const health = await apiFetch('/api/system/health');
                container.innerHTML = '';
                for (const check of health.checks || []) {
                    const item = document.createElement('div');
                    item.className = `p-3 rounded-lg border ${check.ok ? 'bg-emerald-500/5 border-emerald-500/20' : 'bg-pink-500/5 border-pink-500/20'}`;
                    item.innerHTML = `
                        <div class="flex items-center justify-between gap-3">
                            <span class="font-semibold ${check.ok ? 'text-emerald-400' : 'text-pink-400'}">${escapeHtml(check.name)}</span>
                            <span class="text-[10px] ${check.ok ? 'text-emerald-400' : 'text-pink-400'}">${check.ok ? 'OK' : '异常'}</span>
                        </div>
                        <div class="text-[10px] text-slate-500 mt-1 truncate" title="${escapeHtml(check.detail)}">${escapeHtml(check.detail || '')}</div>
                    `;
                    container.appendChild(item);
                }
            } catch (e) {
                container.innerHTML = '<div class="text-pink-400">系统自检加载失败</div>';
            }
        }


        // --- AUTH HANDLERS ---
        
        function setupAuthHandlers() {
            let activeTab = 'login'; // or 'register'
            
            const tabLogin = document.getElementById('tab-login');
            const tabRegister = document.getElementById('tab-register');
            const submitBtn = document.getElementById('auth-submit-btn');

            tabLogin.onclick = () => {
                activeTab = 'login';
                tabLogin.className = "flex-1 pb-3 text-sm font-medium border-b-2 border-cyan-400 text-cyan-400 transition-colors";
                tabRegister.className = "flex-1 pb-3 text-sm font-medium border-b-2 border-transparent text-slate-400 hover:text-slate-200 transition-colors";
                submitBtn.querySelector('span').innerText = '立即登录';
            };

            tabRegister.onclick = () => {
                activeTab = 'register';
                tabRegister.className = "flex-1 pb-3 text-sm font-medium border-b-2 border-cyan-400 text-cyan-400 transition-colors";
                tabLogin.className = "flex-1 pb-3 text-sm font-medium border-b-2 border-transparent text-slate-400 hover:text-slate-200 transition-colors";
                submitBtn.querySelector('span').innerText = '新建并注册账号';
            };

            document.getElementById('auth-form').onsubmit = async (e) => {
                e.preventDefault();
                const username = document.getElementById('auth-username').value;
                const password = document.getElementById('auth-password').value;

                const url = activeTab === 'login' ? '/api/auth/login' : '/api/auth/register';
                
                try {
                    const res = await fetch(`${API_BASE}${url}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ username, password })
                    });
                    
                    if (!res.ok) {
                        const err = await res.json();
                        showToast(err.detail || '账户验证失败', 'error');
                        return;
                    }

                    const data = await res.json();
                    token = data.access_token;
                    localStorage.setItem('thunder_token', token);
                    
                    showToast(activeTab === 'login' ? '欢迎回来，登录成功！' : '账号创建并自动授权成功！', 'success');
                    router.navigate('overview');
                } catch (err) {
                    showToast('网络连接失败，请检查本地后端是否正常启动', 'error');
                }
            };
        }


        // --- ENTRY POINT ---
        window.onload = () => {
            // Check initial auth state
            if (token) {
                router.navigate('overview');
            } else {
                router.navigate('auth');
            }
        };
    </script>
</body>
</html>
